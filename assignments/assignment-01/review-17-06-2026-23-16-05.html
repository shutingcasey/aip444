<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        h1 {
            color: #2c3e50;
        }
        .report-section {
            background: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 15px;
            margin-bottom: 20px;
        }
        .no-findings {
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <h1>Review Report</h1>
    <div class="report-section">
        <h2>Security Review Findings</h2>
        <p class="no-findings">No security issues found.</p>
    </div>
    <div class="report-section">
        <h2>Maintainability Review Findings</h2>
        <p class="no-findings">No maintainability issues found.</p>
    </div>
</body>
</html>
