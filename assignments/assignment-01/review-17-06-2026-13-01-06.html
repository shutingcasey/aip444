<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Review Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        h1 {
            color: #2c3e50;
        }
        .finding {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .severity {
            font-weight: bold;
        }
        .category {
            font-style: italic;
        }
        .path {
            color: #2980b9;
        }
        .line {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <h1>Code Review Report</h1>
    <h2>Findings</h2>
    <div class="finding">
        <div class="severity">Severity: <span>Warning</span></div>
        <div class="category">Category: <span>Security</span></div>
        <div class="path">File: <span>assignments/assignment-01/bad_code.ts</span></div>
        <div class="line">Line: <span>10</span></div>
        <div class="description">Description: A hardcoded password is stored directly in source code. Move it to a secure storage solution.</div>
    </div>
</body>
</html>
